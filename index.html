<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posture Check</title>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Posture Check</h1>
        <p id="status" class="status">Camera off</p>
      </header>

      <section class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="verdict" class="verdict hidden"></div>
      </section>

      <section class="controls">
        <button id="start" class="primary">Start camera</button>
        <button id="calibrate" disabled>Calibrate good posture</button>
        <button id="stop" disabled>Stop</button>
      </section>

      <section class="settings">
        <label>
          Sensitivity
          <input id="sensitivity" type="range" min="0.5" max="2" step="0.1" value="1" />
          <span id="sensitivityValue">1.0</span>
        </label>
        <label>
          Seconds of bad posture before alert
          <input id="hold" type="range" min="2" max="30" step="1" value="6" />
          <span id="holdValue">6s</span>
        </label>
        <label class="checkbox">
          <input id="sound" type="checkbox" checked />
          Play a sound with each alert
        </label>
      </section>

      <section class="readout">
        <ul id="issues" class="issues"></ul>
        <dl class="stats">
          <div><dt>Good posture</dt><dd id="goodTime">0:00</dd></div>
          <div><dt>Bad posture</dt><dd id="badTime">0:00</dd></div>
          <div><dt>Alerts</dt><dd id="alertCount">0</dd></div>
        </dl>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
